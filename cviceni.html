<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvičení</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; padding: 30px 20px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d32; padding-bottom: 15px; }
        h1 { font-size: 1.3rem; font-weight: 400; color: #f0f0f0; }
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }

        /* Dnešní záznam */
        .today-box {
            background-color: #121314; border: 1px solid #2a2d32;
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
        }
        .today-title { font-size: 0.8rem; color: #8a8d92; text-transform: uppercase; font-weight: bold; }
        .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-row { display: flex; flex-direction: column; gap: 5px; }
        .input-label { font-size: 0.78rem; color: #8a8d92; font-weight: bold; }
        .input-field {
            background-color: #1a1c1e; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 12px; border-radius: 8px; font-size: 1.4rem; text-align: center;
            outline: none; transition: border 0.2s; font-weight: 300; width: 100%;
        }
        .input-field:focus { border-color: #009688; }
        .input-field.wide { grid-column: span 2; font-size: 1.2rem; }
        .save-btn {
            width: 100%; background-color: #009688; color: white; border: none;
            padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        .save-btn:active { background-color: #00bfa5; }

        /* Týdenní souhrn */
        .week-box {
            background-color: #121314; border: 1px solid #2a2d32;
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .week-title { font-size: 0.8rem; color: #8a8d92; text-transform: uppercase; font-weight: bold; }
        .week-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .week-stat { text-align: center; }
        .week-stat-val { font-size: 1.3rem; font-weight: 300; color: #009688; }
        .week-stat-lbl { font-size: 0.72rem; color: #8a8d92; margin-top: 2px; }

        /* Kalendář */
        .calendar-box {
            background-color: #121314; border: 1px solid #2a2d32;
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }
        .cal-title { font-size: 0.8rem; color: #8a8d92; text-transform: uppercase; font-weight: bold; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day-name { font-size: 0.65rem; color: #4a4d52; text-align: center; font-weight: bold; padding-bottom: 2px; }
        .cal-day {
            aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; font-size: 0.72rem; font-weight: bold; cursor: default;
        }
        .cal-day.empty { background: transparent; }
        .cal-day.future { background-color: #1a1c1e; color: #4a4d52; }
        .cal-day.rest { background-color: #2a2d32; color: #4a4d52; }
        .cal-day.done { background-color: #1b4d3e; color: #4caf50; }
        .cal-day.today-rest { background-color: #2a2d32; color: #8a8d92; border: 1px solid #3a3f45; }
        .cal-day.today-done { background-color: #009688; color: white; }

        /* Historie */
        .section-title { font-size: 0.8rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; }
        .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
        .history-item {
            background-color: #121314; border: 1px solid #2a2d32; padding: 12px 15px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .history-left { display: flex; flex-direction: column; gap: 3px; }
        .history-date { font-size: 0.8rem; color: #8a8d92; }
        .history-vals { font-size: 0.9rem; color: #e2e2e2; display: flex; gap: 10px; flex-wrap: wrap; }
        .history-vals span { color: #009688; font-weight: bold; }
        .del-btn { background: transparent; border: none; color: #4a4d52; cursor: pointer; font-size: 0.9rem; }
        .del-btn:hover { color: #cf6679; }

        .today-progress { display: flex; flex-direction: column; gap: 9px; padding-top: 4px; }
        .goal-row { display: flex; flex-direction: column; gap: 5px; }
        .goal-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: #aeb2b8; }
        .goal-track { height: 7px; background: #2a2d32; border-radius: 99px; overflow: hidden; }
        .goal-fill { height: 100%; background: #009688; border-radius: 99px; transition: width .2s; }
        .goal-heading { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; }
        .cal-day.partial { background-color: #704b16; color: #ffca70; }
        .cal-day.missed { background-color: #572a32; color: #ff8a9a; }
        .cal-day.today-partial { background-color: #b7791f; color: white; }
        .cal-day.today-missed { background-color: #a33a4b; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💪 Cvičení</h1>
            <div class="sync-status" id="sync-status"></div>
        </div>

        <div class="today-box">
            <div class="today-title">📅 Dnešní záznam</div>
            <div class="inputs-grid">
                <div class="input-row">
                    <div class="input-label">Kliky</div>
                    <input type="number" id="input-kliky" class="input-field" placeholder="0" inputmode="numeric">
                </div>
                <div class="input-row">
                    <div class="input-label">Dřepy</div>
                    <input type="number" id="input-drepy" class="input-field" placeholder="0" inputmode="numeric">
                </div>
                <div class="input-row">
                    <div class="input-label">Činka (opak.)</div>
                    <input type="number" id="input-cinka" class="input-field" placeholder="0" inputmode="numeric">
                </div>
                <div class="input-row">
                    <div class="input-label">Kroky</div>
                    <input type="number" id="input-kroky" class="input-field" placeholder="0" inputmode="numeric">
                </div>
            </div>
            <button class="save-btn" onclick="saveDay()">ULOŽIT ZÁZNAM</button>
            <div class="today-progress" id="today-progress"></div>
        </div>

        <div class="week-box">
            <div class="week-title">📊 Tento týden</div>
            <div class="week-stats">
                <div class="week-stat">
                    <div class="week-stat-val" id="w-kliky">0</div>
                    <div class="week-stat-lbl">Kliky</div>
                </div>
                <div class="week-stat">
                    <div class="week-stat-val" id="w-drepy">0</div>
                    <div class="week-stat-lbl">Dřepy</div>
                </div>
                <div class="week-stat">
                    <div class="week-stat-val" id="w-cinka">0</div>
                    <div class="week-stat-lbl">Činka</div>
                </div>
                <div class="week-stat">
                    <div class="week-stat-val" id="w-kroky">0</div>
                    <div class="week-stat-lbl">Kroky</div>
                </div>
            </div>
        </div>

        <div class="calendar-box">
            <div class="cal-title">📆 Poslední měsíc</div>
            <div class="cal-grid" id="calendar"></div>
        </div>

        <div class="section-title">Historie</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let records = [];
        const syncStatus = document.getElementById('sync-status');
        function setStatus(s) { syncStatus.className = 'sync-status ' + s; }

        function dateKey(date) {
            // Použij místní datum, aby se záznam kolem půlnoci neposunul do jiného dne.
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function todayKey() { return dateKey(new Date()); }

        // Sjednotí datum z HTML, localStorage i Google Sheets na YYYY-MM-DD.
        function normalizeRecordDate(value) {
            if (!value) return '';
            if (value instanceof Date && !isNaN(value)) return dateKey(value);

            const s = String(value).trim();
            // Čisté datum bez času se použije beze změny.
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

            // Datum s časem (např. 2026-11-10T23:00:00.000Z z Google Sheets) je v UTC.
            // Převedeme ho na místní den, jinak by se záznam posunul o den zpět.
            if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
                const dt = new Date(s);
                if (!isNaN(dt)) return dateKey(dt);
            }

            // Český zápis data, např. 9. 11. 2026.
            const cz = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})\.?$/);
            if (cz) return `${cz[3]}-${String(cz[2]).padStart(2, '0')}-${String(cz[1]).padStart(2, '0')}`;

            // Číselné datum z Google Sheets (počet dní od 30. 12. 1899).
            if (/^\d+(\.\d+)?$/.test(s)) {
                const serial = Number(s);
                const date = new Date(Date.UTC(1899, 11, 30) + Math.floor(serial) * 86400000);
                return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;
            }

            const parsed = new Date(s);
            if (!isNaN(parsed)) return dateKey(parsed);
            return '';
        }

        async function loadData() {
            setStatus('syncing');
            const local = localStorage.getItem('cviceni_data');
            if (local) { try { records = JSON.parse(local); render(); } catch(e) { records = []; } }
            try {
                const response = await fetch(`${CLOUD_URL}?mode=cviceni`);
                const cloud = await response.json();
                if (Array.isArray(cloud)) {
                    records = cloud;
                    localStorage.setItem('cviceni_data', JSON.stringify(records));
                    render();
                }
                setStatus('online');
            } catch(err) { setStatus('error'); }
        }

        async function saveDay() {
            const kliky = parseInt(document.getElementById('input-kliky').value) || 0;
            const drepy = parseInt(document.getElementById('input-drepy').value) || 0;
            const cinka = parseInt(document.getElementById('input-cinka').value) || 0;
            const kroky = parseInt(document.getElementById('input-kroky').value) || 0;

            // Prázdný záznam neukládej.
            if (!kliky && !drepy && !cinka && !kroky) return;

            // Každé uložení je samostatný záznam, i když už dnes nějaký existuje.
            const record = {
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                date: todayKey(),
                kliky,
                drepy,
                cinka,
                kroky
            };

            records.unshift(record);

            // Po uložení vyčisti formulář pro další samostatný zápis.
            document.getElementById('input-kliky').value = '';
            document.getElementById('input-drepy').value = '';
            document.getElementById('input-cinka').value = '';
            document.getElementById('input-kroky').value = '';

            localStorage.setItem('cviceni_data', JSON.stringify(records));
            render();

            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'cviceni_save', item: record })
                });
                setStatus('online');
            } catch(err) {
                setStatus('error');
            }
        }

        async function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('cviceni_data', JSON.stringify(records));
            render();
            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'cviceni_delete', id }) });
                setStatus('online');
            } catch(err) { setStatus('error'); }
        }

        // První týden začíná v pondělí 9. 11. 2026.
        // Cíle se zvyšují každé pondělí; po dosažení 50/100/100 se drží.
        const PLAN_START = '2026-11-09';

        function getTargets(dateString) {
            const [y, m, d] = dateString.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const [sy, sm, sd] = PLAN_START.split('-').map(Number);
            const start = new Date(sy, sm - 1, sd);
            const days = Math.floor((date - start) / 86400000);
            const week = Math.max(0, Math.floor(days / 7));
            return {
                kliky: Math.min(25 + week * 5, 50),
                cinka: Math.min(50 + week * 10, 100),
                drepy: Math.min(50 + week * 10, 100),
                kroky: 9000
            };
        }

        function getDailyTotals(dateString) {
            const totals = { kliky: 0, drepy: 0, cinka: 0, kroky: 0 };
            records.filter(r => normalizeRecordDate(r.date) === dateString).forEach(r => {
                totals.kliky += Number(r.kliky) || 0;
                totals.drepy += Number(r.drepy) || 0;
                totals.cinka += Number(r.cinka) || 0;
                totals.kroky += Number(r.kroky) || 0;
            });
            return totals;
        }

        function getDayStatus(dateString) {
            // Před začátkem plánu (PLAN_START) se nic nevyhodnocuje.
            if (dateString < PLAN_START) return 'pre';
            const totals = getDailyTotals(dateString);
            const targets = getTargets(dateString);
            const anyActivity = totals.kliky + totals.drepy + totals.cinka + totals.kroky > 0;
            const complete = Object.keys(targets).every(key => totals[key] >= targets[key]);
            return complete ? 'done' : (anyActivity ? 'partial' : 'missed');
        }

        function renderTodayProgress() {
            const el = document.getElementById('today-progress');
            if (!el) return;
            const totals = getDailyTotals(todayKey());
            const targets = getTargets(todayKey());
            const items = [
                ['Kliky', 'kliky'],
                ['Guma', 'cinka'],
                ['Dřepy', 'drepy'],
                ['Kroky', 'kroky']
            ];
            el.innerHTML = '<div class="goal-heading"><span>Dnešní postup</span><span>cíl se zvyšuje každé pondělí</span></div>' +
                items.map(([label, key]) => {
                    const value = totals[key];
                    const target = targets[key];
                    const pct = Math.min(100, target ? value / target * 100 : 0);
                    return `<div class="goal-row">
                        <div class="goal-meta"><span>${label}</span><span>${value.toLocaleString('cs-CZ')} / ${target.toLocaleString('cs-CZ')}</span></div>
                        <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
                    </div>`;
                }).join('');
        }

        function render() {
            const today = todayKey();
            const todayRecord = records.find(r => normalizeRecordDate(r.date) === today);



            // Týdenní součet — pondělí až dnes
            const now = new Date();
            const monday = new Date(now);
            monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
            monday.setHours(0,0,0,0);

            let wKliky = 0, wDrepy = 0, wCinka = 0, wKroky = 0;
            records.forEach(r => {
                const normalizedDate = normalizeRecordDate(r.date);
                const d = normalizedDate ? new Date(normalizedDate + 'T00:00:00') : new Date(NaN);
                if (d >= monday && d <= now) {
                    wKliky += r.kliky || 0;
                    wDrepy += r.drepy || 0;
                    wCinka += r.cinka || 0;
                    wKroky += r.kroky || 0;
                }
            });
            document.getElementById('w-kliky').innerText = wKliky;
            document.getElementById('w-drepy').innerText = wDrepy;
            document.getElementById('w-cinka').innerText = wCinka;
            document.getElementById('w-kroky').innerText = wKroky > 999 ? Math.round(wKroky/1000) + 'k' : wKroky;
            renderTodayProgress();

            // Kalendář — posledních 35 dní
            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            const dayNames = ['Po','Út','St','Čt','Pá','So','Ne'];
            dayNames.forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-day-name';
                el.innerText = d;
                cal.appendChild(el);
            });

            const recordMap = {};
            records.forEach(r => {
                const key = normalizeRecordDate(r.date);
                if (key) recordMap[key] = true;
            });

            // 5 týdnů (pondělí až neděle), poslední je vždy aktuální týden.
            const start = new Date(monday);
            start.setDate(monday.getDate() - 28);

            for (let i = 0; i < 35; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                const key = dateKey(d);
                const isToday = key === today;
                const isFuture = d > now;
                const hasRecord = !!recordMap[key];
                const status = getDayStatus(key);

                const el = document.createElement('div');
                const popis = { done: 'splněno', partial: 'částečně splněno', missed: 'nic nezaznamenáno', pre: 'před začátkem plánu' };
                el.title = key + ' · ' + (isFuture ? 'budoucnost' : popis[status]);
                el.innerText = d.getDate();

                if (isFuture) {
                    el.className = 'cal-day future';
                } else if (status === 'pre') {
                    el.className = 'cal-day ' + (isToday ? 'today-rest' : 'rest');
                } else if (isToday) {
                    // Dnešek bez záznamu ještě není "propadlý", den neskončil.
                    el.className = 'cal-day ' + (status === 'done' ? 'today-done' : status === 'partial' ? 'today-partial' : 'today-rest');
                } else {
                    el.className = 'cal-day ' + status; // done = zelená, partial = oranžová, missed = červená
                }
                cal.appendChild(el);
            }

            // Historie
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            if (records.length === 0) {
                historyList.innerHTML = '<div style="color:#4a4d52;font-style:italic;text-align:center;padding:20px">Zatím žádné záznamy...</div>';
                return;
            }
            const sorted = [...records].sort((a,b) => normalizeRecordDate(b.date).localeCompare(normalizeRecordDate(a.date)));
            sorted.forEach(r => {
                const normalizedDate = normalizeRecordDate(r.date);
                const d = normalizedDate ? new Date(normalizedDate + 'T00:00:00') : new Date(NaN);
                const dateStr = isNaN(d) ? String(r.date || '') : d.toLocaleDateString('cs-CZ');
                const parts = [];
                if (r.kliky) parts.push(`kliky <span>${r.kliky}</span>`);
                if (r.drepy) parts.push(`dřepy <span>${r.drepy}</span>`);
                if (r.cinka) parts.push(`činka <span>${r.cinka}</span>`);
                if (r.kroky) parts.push(`kroky <span>${r.kroky}</span>`);
                const el = document.createElement('div');
                el.className = 'history-item';
                el.innerHTML = `
                    <div class="history-left">
                        <div class="history-date">${dateStr}${normalizeRecordDate(r.date) === today ? ' · dnes' : ''}</div>
                        <div class="history-vals">${parts.join(' · ')}</div>
                    </div>
                    <button class="del-btn" onclick="deleteRecord('${r.id}')">✕</button>
                `;
                historyList.appendChild(el);
            });
        }

        loadData();
    </script>
</body>
</html>
