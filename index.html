<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Cloudový Simplenote</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e;
            color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background-color: #121314;
            border-right: 1px solid #2a2d32;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #2a2d32;
        }
        .header-top { display: flex; gap: 10px; align-items: center; }
        .new-btn {
            flex: 1;
            background-color: #2a2d32;
            color: #e2e2e2;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .new-btn:hover { background-color: #3a3f45; }
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; transition: background-color 0.3s; flex-shrink: 0; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }
        
        .search-input {
            width: 100%;
            background-color: #1a1c1e;
            border: 1px solid #2a2d32;
            color: #e2e2e2;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input::placeholder { color: #4a4d52; }

        .tags-section {
            padding: 10px 15px;
            border-bottom: 1px solid #2a2d32;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag-badge {
            background-color: #2a2d32;
            color: #8a8d92;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tag-badge:hover { background-color: #3a3f45; color: #e2e2e2; }
        .tag-badge.active { background-color: #009688; color: white; }

        .notes-list { flex: 1; overflow-y: auto; }
        .note-item { padding: 15px 20px; border-bottom: 1px solid #2a2d32; cursor: pointer; transition: background 0.2s; }
        .note-item:hover { background-color: #1a1c1e; }
        .note-item.active { background-color: #009688; color: white; }
        .note-item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
        .note-item-date { font-size: 0.75rem; color: #8a8d92; margin-top: 5px; }
        .note-item.active .note-item-date { color: #e0f2f1; }
        .pin-btn {
            background: transparent; border: none; cursor: pointer;
            font-size: 0.85rem; opacity: 0.25; float: right; margin-left: 6px;
            transition: all 0.2s; padding: 0; filter: grayscale(1);
        }
        .pin-btn:hover { opacity: 0.8; filter: grayscale(0); }
        .pin-btn.pinned { opacity: 1; filter: grayscale(0); }
        .note-item.pinned { border-left: 2px solid #ffb74d; }

        .switch-app-box {
            padding: 15px;
            border-top: 1px solid #2a2d32;
            background-color: #121314;
        }
        .switch-link {
            display: block;
            text-align: center;
            background-color: #1a1c1e;
            color: #8a8d92;
            border: 1px solid #2a2d32;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .switch-link:hover { background-color: #009688; color: white; border-color: #009688; }

        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #f5f0e8; min-width: 0; }

        /* Mobilní horní lišta editoru - skrytá na desktopu */
        .editor-topbar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background-color: #e0dbd2;
            border-bottom: 1px solid #d5cfc3;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: #1a1a1a;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #editor {
            flex: 1; width: 100%; background: transparent; border: none; color: #1a1a1a;
            font-size: 1.35rem; line-height: 1.9; padding: 40px 60px; resize: none; outline: none; font-weight: 400;
            font-family: "Georgia", "Times New Roman", serif;
        }
        #editor::placeholder { color: #aaa; }

        .meta-info { padding: 5px 40px; font-size: 0.85rem; color: #888; display: flex; gap: 20px; background-color: #ede8df; }
        .counter-danger { color: #cf6679; font-weight: bold; }

        .footer { padding: 15px 40px; background-color: #e0dbd2; display: flex; gap: 15px; }
        .footer-btn { padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .copy-btn { background-color: #009688; color: white; flex: 2; }
        .copy-btn:hover { background-color: #00bfa5; }
        .copy-btn.success { background-color: #4caf50; }
        .delete-btn { background-color: #cf6679; color: #121314; flex: 1; }
        .delete-btn:hover { background-color: #ff79c6; }

        /* ===== MOBILNÍ LAYOUT ===== */
        @media (max-width: 720px) {
            body { overflow: hidden; }

            .sidebar, .main-content {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100%;
                height: 100%;
            }

            /* Výchozí stav: vidíme seznam poznámek, editor je odsunutý mimo obrazovku */
            .sidebar {
                transform: translateX(0);
                transition: transform 0.2s ease;
                z-index: 2;
            }
            .main-content {
                transform: translateX(100%);
                transition: transform 0.2s ease;
                z-index: 1;
            }

            /* Když je appka v režimu editoru (třída na body) */
            body.mobile-editor-open .sidebar {
                transform: translateX(-100%);
            }
            body.mobile-editor-open .main-content {
                transform: translateX(0);
            }

            .editor-topbar { display: flex; }

            #editor { padding: 24px 20px; font-size: 1.15rem; }
            .meta-info { padding: 5px 20px; }
            .footer { padding: 12px 20px; flex-wrap: wrap; }
        }

        @media (min-width: 721px) {
            .editor-topbar { display: none; }
        }

        .empty-hint {
            padding: 60px 20px;
            text-align: center;
            color: #8a8d92;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <button class="new-btn" onclick="createNewNote()">+ Nová poznámka</button>
                <div class="sync-status" id="sync-status" title="Stav synchronizace"></div>
            </div>
            <input type="text" id="search-bar" class="search-input" placeholder="Hledat v poznámkách..." oninput="filterNotes()">
        </div>
        
        <div class="tags-section" id="tags-section"></div>
        <div class="notes-list" id="notes-list"></div>

        <div class="switch-app-box">
            <a href="todo.html" class="switch-link">PŘEPNOUT NA ÚKOLY ✅</a>
        </div>
    </div>

    <div class="main-content">
        <div class="editor-topbar">
            <button class="back-btn" onclick="closeMobileEditor()">← Zpět</button>
        </div>
        <textarea id="editor" placeholder="Začněte psát... První řádek bude název." autofocus></textarea>
        <div class="meta-info">
            <span id="char-count">Znaky: 0 / 280</span>
            <span id="word-count">Slova: 0</span>
        </div>
        <div class="footer">
            <button class="footer-btn copy-btn" id="copy-btn" onclick="copyText()">ZKOPÍROVAT TEXT</button>
            <button class="footer-btn delete-btn" onclick="deleteCurrentNote()">SMAZAT</button>
        </div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let notes = []; let currentNoteId = null; let saveTimeout = null; let selectedTag = null;
        const editor = document.getElementById('editor');
        const notesList = document.getElementById('notes-list');
        const tagsSection = document.getElementById('tags-section');
        const searchBar = document.getElementById('search-bar');
        const copyBtn = document.getElementById('copy-btn');
        const syncStatus = document.getElementById('sync-status');
        const charCountEl = document.getElementById('char-count');
        const wordCountEl = document.getElementById('word-count');

        const isMobile = () => window.matchMedia('(max-width: 720px)').matches;

        function openMobileEditor() {
            if (isMobile()) document.body.classList.add('mobile-editor-open');
        }
        function closeMobileEditor() {
            document.body.classList.remove('mobile-editor-open');
        }

        function setStatus(status) { syncStatus.className = 'sync-status ' + status; }

        function updateCounters() {
            const text = editor.value;
            const charCount = text.length;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            charCountEl.innerText = `Znaky: ${charCount} / 280`;
            wordCountEl.innerText = `Slova: ${words.length}`;
            charCountEl.className = charCount > 280 ? 'counter-danger' : '';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setStatus('syncing');
            const local = localStorage.getItem('simplenote_vibe_data');
            if (local) {
                try {
                    notes = JSON.parse(local);
                    if (notes.length > 0) { currentNoteId = notes[0].id; renderTags(); renderNotesList(); loadCurrentNote(); updateCounters(); }
                } catch(e) { notes = []; }
            }
            try {
                const response = await fetch(CLOUD_URL);
                const cloudNotes = await response.json();
                if (Array.isArray(cloudNotes) && cloudNotes.length > 0) {
                    notes = cloudNotes;
                    localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
                    if (!currentNoteId || !notes.find(n => n.id === currentNoteId)) { currentNoteId = notes[0].id; }
                    renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
                } else if (notes.length === 0) {
                    createNewNote();
                }
                // Zelená tečka vždy když cloud odpoví
                setStatus('online');
            } catch (err) {
                console.error(err);
                setStatus('error');
                if (notes.length === 0) createNewNote();
            }

            // Na mobilu startujeme na seznamu poznámek, ne rovnou v editoru
            if (isMobile()) {
                document.body.classList.remove('mobile-editor-open');
            }
        });

        function createNewNote() {
            const newNote = { id: Date.now().toString(), content: '', updatedAt: new Date().toISOString() };
            notes.unshift(newNote); currentNoteId = newNote.id; saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
            openMobileEditor();
            editor.focus();
        }

        function loadCurrentNote() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            editor.value = currentNote ? currentNote.content : '';
            updateCounters();
        }

        editor.addEventListener('input', () => {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.content = editor.value;
                currentNote.updatedAt = new Date().toISOString();
                notes = [currentNote, ...notes.filter(n => n.id !== currentNoteId)];
                renderTags(); renderNotesList(); updateCounters();
                localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
                setStatus('syncing'); clearTimeout(saveTimeout); saveTimeout = setTimeout(saveAndSync, 1200);
            }
        });

        async function saveAndSync() {
            localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'notes_save', notes: notes }) });
                setStatus('online');
            } catch (err) { console.error(err); setStatus('error'); }
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                const currentNote = notes.find(n => n.id === currentNoteId);
                if (currentNote) { currentNote.content = ''; saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters(); }
                return;
            }
            notes = notes.filter(n => n.id !== currentNoteId);
            currentNoteId = notes[0].id;
            saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
        }

        function getAllTags() {
            const tags = new Set();
            notes.forEach(note => {
                const matches = note.content.match(/#[\wáéíóúýčďěňřšťžůú]+/g);
                if (matches) matches.forEach(tag => tags.add(tag.toLowerCase()));
            });
            return Array.from(tags).sort();
        }

        function renderTags() {
            const tags = getAllTags(); tagsSection.innerHTML = '';
            if (tags.length === 0) { tagsSection.style.display = 'none'; return; }
            tagsSection.style.display = 'flex';
            const allBtn = document.createElement('span'); allBtn.classList.add('tag-badge');
            if (!selectedTag) allBtn.classList.add('active'); allBtn.innerText = '🏷️ Vše';
            allBtn.onclick = () => { selectedTag = null; renderTags(); renderNotesList(); };
            tagsSection.appendChild(allBtn);
            tags.forEach(tag => {
                const badge = document.createElement('span'); badge.classList.add('tag-badge');
                if (selectedTag === tag) badge.classList.add('active'); badge.innerText = tag;
                badge.onclick = () => { selectedTag = (selectedTag === tag) ? null : tag; renderTags(); renderNotesList(); };
                tagsSection.appendChild(badge);
            });
        }

        function filterNotes() { renderNotesList(); }

        function togglePin(e, id) {
            e.stopPropagation();
            e.preventDefault();
            const note = notes.find(n => n.id === id);
            if (note) {
                note.pinned = !note.pinned;
                // Nepřesouvej připnutou poznámku na začátek pole — jen označ
                localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
                renderTags();
                renderNotesList();
                // Ulož do cloudu bez změny pořadí
                fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'notes_save', notes: notes }) }).catch(() => {});
            }
        }

        function renderNotesList() {
            notesList.innerHTML = ''; const query = searchBar.value.toLowerCase().trim();

            // Připnuté nahoru, pak ostatní (pořadí zachováno)
            const filtered = notes.filter(note => {
                const contentLower = note.content.toLowerCase();
                if (query && !contentLower.includes(query)) return false;
                if (selectedTag && !contentLower.includes(selectedTag)) return false;
                return true;
            });
            const pinned = filtered.filter(n => n.pinned);
            const unpinned = filtered.filter(n => !n.pinned);
            const sorted = [...pinned, ...unpinned];

            if (sorted.length === 0) {
                notesList.innerHTML = '<div class="empty-hint">Nic tu není. Klepni na „+ Nová poznámka".</div>';
                return;
            }

            sorted.forEach(note => {
                const item = document.createElement('div');
                item.classList.add('note-item');
                if (note.pinned) item.classList.add('pinned');
                if (note.id === currentNoteId) item.classList.add('active');
                item.onclick = () => {
                    currentNoteId = note.id;
                    renderNotesList();
                    loadCurrentNote();
                    openMobileEditor();
                };
                const firstLine = note.content.trim().split('\n')[0];
                const title = firstLine || 'Bez názvu';
                let displayDate = note.updatedAt;
                if (note.updatedAt) {
                    const parsed = new Date(note.updatedAt);
                    if (!isNaN(parsed)) displayDate = parsed.toLocaleDateString('cs-CZ');
                }
                item.innerHTML = `
                    <div class="note-item-title">
                        <button class="pin-btn ${note.pinned ? 'pinned' : ''}" title="${note.pinned ? 'Odepnout' : 'Připnout'}">📌</button>
                        ${title}
                    </div>
                    <div class="note-item-date">${displayDate}</div>
                `;
                // Přidej listener na špendlík
                const pinBtn = item.querySelector('.pin-btn');
                pinBtn.addEventListener('click', (e) => togglePin(e, note.id));
                notesList.appendChild(item);
            });
        }

        function fixQuotes(text) {
            // Nahraď VŠECHNY varianty uvozovek (rovné ", anglické "" '', české „" apod.)
            // jednotně na české „..."
            // Sjednotíme všechny varianty na rovnou " a pak rozhodneme open/close
            const quoteChars = [
                '"',        // rovná
                '\u201c',  // " levá anglická
                '\u201d',  // " pravá anglická
                '\u201e',  // „ levá česká
                '\u00ab',  // « francouzská
                '\u00bb'   // » francouzská
            ];

            let result = '';
            let open = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (quoteChars.includes(ch)) {
                    if (!open) {
                        result += '\u201e'; // „
                        open = true;
                    } else {
                        result += '\u201c'; // "
                        open = false;
                    }
                } else {
                    result += ch;
                }
            }
            return result;
        }

        function copyText() {
            editor.select();
            const fixedText = fixQuotes(editor.value);
            navigator.clipboard.writeText(fixedText).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'ZKOPÍROVÁNO!'; copyBtn.classList.add('success');
                setTimeout(() => { copyBtn.innerText = originalText; copyBtn.classList.remove('success'); }, 1500);
            });
        }

        // Zvuk psacího stroje
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function typewriterClick() {
            if (!audioCtx) audioCtx = new AudioCtx();
            const bufferSize = Math.floor(audioCtx.sampleRate * 0.04);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 8);
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200 + Math.random() * 400;
            filter.Q.value = 0.8;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.18 + Math.random() * 0.08;
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        }

        editor.addEventListener('keydown', (e) => {
            if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') {
                typewriterClick();
            }
        });
    </script>
</body>
</html>
