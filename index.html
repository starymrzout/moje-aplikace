<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Cloudový Simplenote</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e;
            color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background-color: #121314;
            border-right: 1px solid #2a2d32;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #2a2d32;
        }
        .header-top { display: flex; gap: 10px; align-items: center; }
        .new-btn {
            flex: 1;
            background-color: #2a2d32;
            color: #e2e2e2;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .new-btn:hover { background-color: #3a3f45; }
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; transition: background-color 0.3s; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }
        
        .search-input {
            width: 100%;
            background-color: #1a1c1e;
            border: 1px solid #2a2d32;
            color: #e2e2e2;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input::placeholder { color: #4a4d52; }

        .tags-section {
            padding: 10px 15px;
            border-bottom: 1px solid #2a2d32;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag-badge {
            background-color: #2a2d32;
            color: #8a8d92;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tag-badge:hover { background-color: #3a3f45; color: #e2e2e2; }
        .tag-badge.active { background-color: #009688; color: white; }

        .notes-list { flex: 1; overflow-y: auto; }
        .note-item { padding: 15px 20px; border-bottom: 1px solid #2a2d32; cursor: pointer; transition: background 0.2s; }
        .note-item:hover { background-color: #1a1c1e; }
        .note-item.active { background-color: #009688; color: white; }
        .note-item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
        .note-item-date { font-size: 0.75rem; color: #8a8d92; margin-top: 5px; }
        .note-item.active .note-item-date { color: #e0f2f1; }

        .switch-app-box {
            padding: 15px;
            border-top: 1px solid #2a2d32;
            background-color: #121314;
        }
        .switch-link {
            display: block;
            text-align: center;
            background-color: #1a1c1e;
            color: #8a8d92;
            border: 1px solid #2a2d32;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .switch-link:hover { background-color: #009688; color: white; border-color: #009688; }

        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #1a1c1e; }
        #editor {
            flex: 1; width: 100%; background: transparent; border: none; color: #d0d0d0;
            font-size: 1.05rem; line-height: 1.8; padding: 40px 60px; resize: none; outline: none; font-weight: 400;
            font-family: "Georgia", "Times New Roman", serif;
        }
        #editor::placeholder { color: #4a4d52; }

        .meta-info { padding: 5px 40px; font-size: 0.85rem; color: #8a8d92; display: flex; gap: 20px; background-color: #1a1c1e; }
        .counter-danger { color: #cf6679; font-weight: bold; }

        .footer { padding: 15px 40px; background-color: #121314; display: flex; gap: 15px; }
        .footer-btn { padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .copy-btn { background-color: #009688; color: white; flex: 2; }
        .copy-btn:hover { background-color: #00bfa5; }
        .copy-btn.success { background-color: #4caf50; }
        .delete-btn { background-color: #cf6679; color: #121314; flex: 1; }
        .delete-btn:hover { background-color: #ff79c6; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <button class="new-btn" onclick="createNewNote()">+ Nová poznámka</button>
                <div class="sync-status" id="sync-status" title="Stav synchronizace"></div>
            </div>
            <input type="text" id="search-bar" class="search-input" placeholder="Hledat v poznámkách..." oninput="filterNotes()">
        </div>
        
        <div class="tags-section" id="tags-section"></div>
        <div class="notes-list" id="notes-list"></div>

        <div class="switch-app-box">
            <a href="todo.html" class="switch-link">PŘEPNOUT NA ÚKOLY ✅</a>
        </div>
    </div>

    <div class="main-content">
        <textarea id="editor" placeholder="Začněte psát... První řádek bude název." autofocus></textarea>
        <div class="meta-info">
            <span id="char-count">Znaky: 0 / 280</span>
            <span id="word-count">Slova: 0</span>
        </div>
        <div class="footer">
            <button class="footer-btn copy-btn" id="copy-btn" onclick="copyText()">ZKOPÍROVAT TEXT</button>
            <button class="footer-btn delete-btn" onclick="deleteCurrentNote()">SMAZAT</button>
        </div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let notes = []; let currentNoteId = null; let saveTimeout = null; let selectedTag = null;
        const editor = document.getElementById('editor');
        const notesList = document.getElementById('notes-list');
        const tagsSection = document.getElementById('tags-section');
        const searchBar = document.getElementById('search-bar');
        const copyBtn = document.getElementById('copy-btn');
        const syncStatus = document.getElementById('sync-status');
        const charCountEl = document.getElementById('char-count');
        const wordCountEl = document.getElementById('word-count');

        function setStatus(status) { syncStatus.className = 'sync-status ' + status; }

        function updateCounters() {
            const text = editor.value;
            const charCount = text.length;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            charCountEl.innerText = `Znaky: ${charCount} / 280`;
            wordCountEl.innerText = `Slova: ${words.length}`;
            charCountEl.className = charCount > 280 ? 'counter-danger' : '';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setStatus('syncing');
            const local = localStorage.getItem('simplenote_vibe_data');
            if (local) {
                try {
                    notes = JSON.parse(local);
                    if (notes.length > 0) { currentNoteId = notes[0].id; renderTags(); renderNotesList(); loadCurrentNote(); updateCounters(); }
                } catch(e) { notes = []; }
            }
            try {
                const response = await fetch(CLOUD_URL);
                const cloudNotes = await response.json();
                if (Array.isArray(cloudNotes) && cloudNotes.length > 0) {
                    notes = cloudNotes;
                    localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
                    if (!currentNoteId || !notes.find(n => n.id === currentNoteId)) { currentNoteId = notes[0].id; }
                    renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
                } else if (notes.length === 0) {
                    createNewNote();
                }
                setStatus('online');
            } catch (err) {
                console.error(err);
                setStatus('error');
                if (notes.length === 0) {
                    const newNote = { id: Date.now().toString(), content: '', updatedAt: new Date().toISOString() };
                    notes.unshift(newNote); currentNoteId = newNote.id; renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
                }
            }
        });

        function createNewNote() {
            const newNote = { id: Date.now().toString(), content: '', updatedAt: new Date().toISOString() };
            notes.unshift(newNote); currentNoteId = newNote.id; saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters(); editor.focus();
        }

        function loadCurrentNote() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            editor.value = currentNote ? currentNote.content : '';
            updateCounters();
        }

        // BEZPEČNÉ AUTOMATICKÉ UVOZOVEK BEZ SAHÁNÍ DO PAMĚTI ARCHIVU
        editor.addEventListener('keydown', (e) => {
            if (e.key === '"' || e.key === '“' || e.key === '”' || e.code === 'Quote') {
                e.preventDefault();
                
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const text = editor.value;
                
                const charBefore = start > 0 ? text.charAt(start - 1) : '';
                
                let quote = '„';
                if (charBefore && !/\s/.test(charBefore) && charBefore !== '(' && charBefore !== '[') {
                    quote = '“';
                }
                
                // Vloží uvozovku do textového pole
                editor.value = text.substring(0, start) + quote + text.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 1;
                
                // Předá práci originální funkci input, která bezpečně synchronizuje beze ztráty dat
                editor.dispatchEvent(new Event('input'));
            }
        });

        editor.addEventListener('input', () => {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.content = editor.value;
                currentNote.updatedAt = new Date().toISOString();
                notes = [currentNote, ...notes.filter(n => n.id !== currentNoteId)];
                renderTags(); renderNotesList(); updateCounters();
                localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
                setStatus('syncing'); clearTimeout(saveTimeout); saveTimeout = setTimeout(saveAndSync, 1200);
            }
        });

        async function saveAndSync() {
            localStorage.setItem('simplenote_vibe_data', JSON.stringify(notes));
            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'notes_save', notes: notes }) });
                setStatus('online');
            } catch (err) { console.error(err); setStatus('error'); }
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                const currentNote = notes.find(n => n.id === currentNoteId);
                if (currentNote) { currentNote.content = ''; saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters(); }
                return;
            }
            notes = notes.filter(n => n.id !== currentNoteId);
            currentNoteId = notes[0].id;
            saveAndSync(); renderTags(); renderNotesList(); loadCurrentNote(); updateCounters();
        }

        function getAllTags() {
            const tags = new Set();
            notes.forEach(note => {
                const matches = note.content.match(/#[\wáéíóúýčďěňřšťžůú]+/g);
                if (matches) matches.forEach(tag => tags.add(tag.toLowerCase()));
            });
            return Array.from(tags).sort();
        }

        function renderTags() {
            const tags = getAllTags(); tagsSection.innerHTML = '';
            if (tags.length === 0) { tagsSection.style.display = 'none'; return; }
            tagsSection.style.display = 'flex';
            const allBtn = document.createElement('span'); allBtn.classList.add('tag-badge');
            if (!selectedTag) allBtn.classList.add('active'); allBtn.innerText = '🏷️ Vše';
            allBtn.onclick = () => { selectedTag = null; renderTags(); renderNotesList(); };
            tagsSection.appendChild(allBtn);
            tags.forEach(tag => {
                const badge = document.createElement('span'); badge.classList.add('tag-badge');
                if (selectedTag === tag) badge.classList.add('active'); badge.innerText = tag;
                badge.onclick = () => { selectedTag = (selectedTag === tag) ? null : tag; renderTags(); renderNotesList(); };
                tagsSection.appendChild(badge);
            });
        }

        function filterNotes() { renderNotesList(); }

        function renderNotesList() {
            notesList.innerHTML = ''; const query = searchBar.value.toLowerCase().trim();
            notes.forEach(note => {
                const contentLower = note.content.toLowerCase();
                if (query && !contentLower.includes(query)) return;
                if (selectedTag && !contentLower.includes(selectedTag)) return;
                const item = document.createElement('div'); item.classList.add('note-item');
                if (note.id === currentNoteId) item.classList.add('active');
                item.onclick = () => { currentNoteId = note.id; renderNotesList(); loadCurrentNote(); };
                const firstLine = note.content.trim().split('\n')[0];
                const title = firstLine || 'Bez názvu';
                let displayDate = note.updatedAt;
                if (note.updatedAt) {
                    const parsed = new Date(note.updatedAt);
                    if (!isNaN(parsed)) displayDate = parsed.toLocaleDateString('cs-CZ');
                }
                item.innerHTML = `<div class="note-item-title">${title}</div><div class="note-item-date">${displayDate}</div>`;
                notesList.appendChild(item);
            });
        }

        function copyText() {
            editor.select();
            navigator.clipboard.writeText(editor.value).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'ZKOPÍROVÁNO!'; copyBtn.classList.add('success');
                setTimeout(() => { copyBtn.innerText = originalText; copyBtn.classList.remove('success'); }, 1500);
            });
        }
    </script>
</body>
</html>
