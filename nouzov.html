<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouzov — obyvatelé</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏘️</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .topbar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-bottom: 1px solid #2a2d32;
            background-color: #121314; flex-shrink: 0;
        }
        .topbar h1 { font-size: 1.1rem; font-weight: 400; color: #f0f0f0; flex: 1; }
        .search-input {
            flex: 2; background-color: #1a1c1e; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border 0.2s;
        }
        .search-input:focus { border-color: #009688; }
        .search-input::placeholder { color: #4a4d52; }
        .add-btn {
            background-color: #009688; color: white; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: bold;
            cursor: pointer; white-space: nowrap;
        }
        .add-btn:hover { background-color: #00bfa5; }
        .sync-status { width: 8px; height: 8px; border-radius: 50%; background-color: #8a8d92; flex-shrink: 0; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }

        .main { display: flex; flex: 1; overflow: hidden; }

        /* Levý sloupec — seznam */
        .sidebar {
            width: 260px; flex-shrink: 0; border-right: 1px solid #2a2d32;
            display: flex; flex-direction: column; background-color: #121314;
        }
        .sidebar-count { padding: 8px 14px; font-size: 0.75rem; color: #4a4d52; border-bottom: 1px solid #2a2d32; }
        .list { flex: 1; overflow-y: auto; }
        .list-item {
            padding: 10px 14px; border-bottom: 1px solid #1a1c1e; cursor: pointer;
            transition: background 0.15s;
        }
        .list-item:hover { background-color: #1a1c1e; }
        .list-item.active { background-color: #009688; }
        .list-item.active .list-name { color: white; }
        .list-item.active .list-sub { color: #e0f2f1; }
        .list-name { font-size: 0.95rem; font-weight: 600; color: #f0f0f0; }
        .list-sub { font-size: 0.75rem; color: #8a8d92; margin-top: 2px; }
        .letter-divider {
            padding: 6px 14px 4px; font-size: 0.7rem; font-weight: bold;
            color: #009688; background-color: #121314; text-transform: uppercase;
            border-bottom: 1px solid #2a2d32; position: sticky; top: 0;
        }

        /* Pravý panel — detail */
        .detail {
            flex: 1; overflow-y: auto; padding: 30px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .detail-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #4a4d52; font-style: italic;
        }
        .detail-name { font-size: 1.6rem; font-weight: 300; color: #f0f0f0; }
        .detail-sub { font-size: 0.9rem; color: #8a8d92; margin-top: 4px; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .detail-field { display: flex; flex-direction: column; gap: 3px; }
        .detail-label { font-size: 0.72rem; color: #4a4d52; text-transform: uppercase; font-weight: bold; }
        .detail-value { font-size: 0.95rem; color: #e2e2e2; }
        .detail-note { font-size: 0.95rem; color: #c0c0c0; line-height: 1.6; }

        .detail-actions { display: flex; gap: 10px; margin-top: 5px; }
        .edit-btn {
            background-color: #009688; color: white; border: none;
            padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer;
        }
        .edit-btn:hover { background-color: #00bfa5; }
        .del-btn {
            background-color: transparent; color: #cf6679; border: 1px solid #cf6679;
            padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
        }
        .del-btn:hover { background-color: #cf6679; color: white; }

        mark { background-color: #009688; color: white; border-radius: 2px; padding: 0 2px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: flex-start;
            padding: 30px 20px; overflow-y: auto;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background-color: #1a1c1e; border: 1px solid #2a2d32;
            border-radius: 12px; padding: 24px; width: 100%; max-width: 520px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #f0f0f0; }
        .close-btn { background: transparent; border: none; color: #8a8d92; font-size: 1.3rem; cursor: pointer; }
        .close-btn:hover { color: #cf6679; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 0.78rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; }
        .field input, .field textarea {
            background-color: #121314; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; outline: none;
            transition: border 0.2s; font-family: inherit;
        }
        .field input:focus, .field textarea:focus { border-color: #009688; }
        .field textarea { resize: vertical; min-height: 80px; }
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .fields-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .modal-footer { display: flex; gap: 10px; margin-top: 5px; }
        .save-btn {
            flex: 2; background-color: #009688; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        .save-btn:hover { background-color: #00bfa5; }
        .mdelete-btn {
            flex: 1; background-color: transparent; color: #cf6679; border: 1px solid #cf6679;
            padding: 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; display: none;
        }
        .mdelete-btn:hover { background-color: #cf6679; color: white; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🏘️ Nouzov</h1>
        <input type="text" id="search" class="search-input" placeholder="Hledat..." oninput="render()">
        <button class="add-btn" onclick="openModal()">+ Přidat</button>
        <div class="sync-status" id="sync-status"></div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="sidebar-count" id="sidebar-count"></div>
            <div class="list" id="list"></div>
        </div>
        <div class="detail" id="detail">
            <div class="detail-empty">Vyber postavu ze seznamu</div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Nová postava</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="fields-grid3">
                <div class="field">
                    <label>Titul</label>
                    <input type="text" id="f-titul" placeholder="Ing., Bc., ...">
                </div>
                <div class="field">
                    <label>Jméno *</label>
                    <input type="text" id="f-jmeno" placeholder="Jan">
                </div>
                <div class="field">
                    <label>Příjmení *</label>
                    <input type="text" id="f-prijmeni" placeholder="Novák">
                </div>
            </div>
            <div class="fields-grid">
                <div class="field">
                    <label>Věk</label>
                    <input type="text" id="f-vek" placeholder="52">
                </div>
                <div class="field">
                    <label>Bydliště</label>
                    <input type="text" id="f-bydliste" placeholder="Nouzov 14">
                </div>
            </div>
            <div class="field">
                <label>Instituce</label>
                <input type="text" id="f-instituce" placeholder="radnice, hospoda U Brejšků, pila...">
            </div>
            <div class="field">
                <label>Funkce / zaměstnání</label>
                <input type="text" id="f-funkce" placeholder="starosta, řidič autobusu...">
            </div>
            <div class="fields-grid">
                <div class="field">
                    <label>Partner / manžel/ka</label>
                    <input type="text" id="f-partner" placeholder="Marie Nováková">
                </div>
                <div class="field">
                    <label>Děti / rodina</label>
                    <input type="text" id="f-rodina" placeholder="syn Petr, dcera Jana">
                </div>
            </div>
            <div class="field">
                <label>Charakter</label>
                <input type="text" id="f-charakter" placeholder="temperamentní, lakomý...">
            </div>
            <div class="field">
                <label>Koníčky</label>
                <input type="text" id="f-konicky" placeholder="zahrádkaření, myslivost...">
            </div>
            <div class="field">
                <label>Poznámka</label>
                <textarea id="f-poznamka" placeholder="Cokoliv dalšího..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="save-btn" onclick="savePostava()">Uložit</button>
                <button class="mdelete-btn" id="mdelete-btn" onclick="deletePostava()">Smazat</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let postavy = [];
        let selectedId = null;
        let editingId = null;
        const syncStatus = document.getElementById('sync-status');
        function setStatus(s) { syncStatus.className = 'sync-status ' + s; }

        async function loadData() {
            setStatus('syncing');
            const local = localStorage.getItem('nouzov_data');
            if (local) { try { postavy = JSON.parse(local); render(); } catch(e) { postavy = []; } }
            try {
                const response = await fetch(`${CLOUD_URL}?mode=nouzov`);
                const cloud = await response.json();
                if (Array.isArray(cloud)) {
                    postavy = cloud;
                    localStorage.setItem('nouzov_data', JSON.stringify(postavy));
                    render();
                }
                setStatus('online');
            } catch(err) { setStatus('error'); }
        }

        function fullName(p) {
            return [p.titul, p.jmeno, p.prijmeni].filter(Boolean).join(' ');
        }

        function sortKey(p) {
            return (p.prijmeni || p.jmeno || '').toLowerCase();
        }

        function searchText(p) {
            return [p.titul, p.jmeno, p.prijmeni, p.vek, p.bydliste, p.instituce,
                    p.funkce, p.partner, p.rodina, p.charakter, p.konicky, p.poznamka]
                .filter(Boolean).join(' ').toLowerCase();
        }

        function highlight(text, query) {
            if (!query || !text) return text || '';
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(text).replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
        }

        function render() {
            const query = document.getElementById('search').value.toLowerCase().trim();
            let filtered = query ? postavy.filter(p => searchText(p).includes(query)) : [...postavy];
            filtered.sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'cs'));

            document.getElementById('sidebar-count').innerText = filtered.length + ' / ' + postavy.length + ' obyvatel';

            const list = document.getElementById('list');
            list.innerHTML = '';

            if (filtered.length === 0) {
                list.innerHTML = '<div style="padding:20px;color:#4a4d52;font-style:italic;font-size:0.85rem;">Nikdo nenalezen</div>';
                return;
            }

            let lastLetter = '';
            filtered.forEach(p => {
                const letter = (p.prijmeni || p.jmeno || '?')[0].toUpperCase();
                if (letter !== lastLetter) {
                    const div = document.createElement('div');
                    div.className = 'letter-divider';
                    div.innerText = letter;
                    list.appendChild(div);
                    lastLetter = letter;
                }
                const el = document.createElement('div');
                el.className = 'list-item' + (p.id === selectedId ? ' active' : '');
                el.onclick = () => selectPostava(p.id);
                const hl = t => highlight(t, query);
                el.innerHTML = `
                    <div class="list-name">${hl(p.prijmeni || '')}${p.prijmeni && p.jmeno ? ', ' : ''}${hl(p.jmeno || '')}</div>
                    <div class="list-sub">${hl(p.funkce || p.instituce || '')}</div>
                `;
                list.appendChild(el);
            });

            // Refresh detail pokud je vybraná postava
            if (selectedId) showDetail(selectedId, query);
        }

        function selectPostava(id) {
            selectedId = id;
            render();
        }

        function showDetail(id, query) {
            const p = postavy.find(x => x.id === id);
            const detail = document.getElementById('detail');
            if (!p) { detail.innerHTML = '<div class="detail-empty">Vyber postavu ze seznamu</div>'; return; }
            const hl = t => highlight(t, query || '');

            const fields = [
                ['Věk', p.vek], ['Bydliště', p.bydliste],
                ['Instituce', p.instituce], ['Funkce', p.funkce],
                ['Partner / manžel/ka', p.partner], ['Děti / rodina', p.rodina],
                ['Charakter', p.charakter], ['Koníčky', p.konicky]
            ].filter(([, v]) => v);

            detail.innerHTML = `
                <div>
                    <div class="detail-name">${hl(fullName(p))}</div>
                    ${p.funkce || p.instituce ? `<div class="detail-sub">${hl(p.funkce || '')}${p.funkce && p.instituce ? ' · ' : ''}${hl(p.instituce || '')}</div>` : ''}
                </div>
                ${fields.length ? `<div class="detail-grid">${fields.map(([l, v]) => `<div class="detail-field"><div class="detail-label">${l}</div><div class="detail-value">${hl(v)}</div></div>`).join('')}</div>` : ''}
                ${p.poznamka ? `<div class="detail-field"><div class="detail-label">Poznámka</div><div class="detail-note">${hl(p.poznamka)}</div></div>` : ''}
                <div class="detail-actions">
                    <button class="edit-btn" onclick="openModal('${p.id}')">Upravit</button>
                    <button class="del-btn" onclick="deleteById('${p.id}')">Smazat</button>
                </div>
            `;
        }

        function openModal(id) {
            editingId = id || null;
            const p = id ? postavy.find(x => x.id === id) : null;
            document.getElementById('modal-title').innerText = p ? 'Upravit postavu' : 'Nová postava';
            document.getElementById('f-titul').value = p ? p.titul || '' : '';
            document.getElementById('f-jmeno').value = p ? p.jmeno || '' : '';
            document.getElementById('f-prijmeni').value = p ? p.prijmeni || '' : '';
            document.getElementById('f-vek').value = p ? p.vek || '' : '';
            document.getElementById('f-bydliste').value = p ? p.bydliste || '' : '';
            document.getElementById('f-instituce').value = p ? p.instituce || '' : '';
            document.getElementById('f-funkce').value = p ? p.funkce || '' : '';
            document.getElementById('f-partner').value = p ? p.partner || '' : '';
            document.getElementById('f-rodina').value = p ? p.rodina || '' : '';
            document.getElementById('f-charakter').value = p ? p.charakter || '' : '';
            document.getElementById('f-konicky').value = p ? p.konicky || '' : '';
            document.getElementById('f-poznamka').value = p ? p.poznamka || '' : '';
            document.getElementById('mdelete-btn').style.display = p ? 'block' : 'none';
            document.getElementById('modal-overlay').classList.add('visible');
            setTimeout(() => document.getElementById('f-jmeno').focus(), 100);
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('visible');
            editingId = null;
        }

        function closeOnOverlay(e) {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        }

        async function savePostava() {
            const jmeno = document.getElementById('f-jmeno').value.trim();
            const prijmeni = document.getElementById('f-prijmeni').value.trim();
            if (!jmeno && !prijmeni) { document.getElementById('f-jmeno').focus(); return; }

            const postava = {
                id: editingId || Date.now().toString(),
                titul: document.getElementById('f-titul').value.trim(),
                jmeno, prijmeni,
                vek: document.getElementById('f-vek').value.trim(),
                bydliste: document.getElementById('f-bydliste').value.trim(),
                instituce: document.getElementById('f-instituce').value.trim(),
                funkce: document.getElementById('f-funkce').value.trim(),
                partner: document.getElementById('f-partner').value.trim(),
                rodina: document.getElementById('f-rodina').value.trim(),
                charakter: document.getElementById('f-charakter').value.trim(),
                konicky: document.getElementById('f-konicky').value.trim(),
                poznamka: document.getElementById('f-poznamka').value.trim()
            };

            if (editingId) {
                postavy = postavy.map(p => p.id === editingId ? postava : p);
            } else {
                postavy.unshift(postava);
                selectedId = postava.id;
            }

            localStorage.setItem('nouzov_data', JSON.stringify(postavy));
            closeModal();
            render();

            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: editingId ? 'nouzov_update' : 'nouzov_add', item: postava }) });
                setStatus('online');
            } catch(err) { setStatus('error'); }
        }

        async function deleteById(id) {
            if (!confirm('Smazat tuto postavu?')) return;
            postavy = postavy.filter(p => p.id !== id);
            if (selectedId === id) selectedId = null;
            localStorage.setItem('nouzov_data', JSON.stringify(postavy));
            render();
            document.getElementById('detail').innerHTML = '<div class="detail-empty">Vyber postavu ze seznamu</div>';
            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'nouzov_delete', id }) });
                setStatus('online');
            } catch(err) { setStatus('error'); }
        }

        async function deletePostava() {
            if (editingId) { closeModal(); await deleteById(editingId); }
        }

        loadData();
    </script>
</body>
</html>
