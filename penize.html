<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanční bilance</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d32; padding-bottom: 15px; }
        h1 { font-size: 1.4rem; font-weight: 400; color: #f0f0f0; }
        
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }

        .balance-card { background-color: #121314; border: 1px solid #2a2d32; padding: 20px; border-radius: 8px; text-align: center; }
        .balance-value { font-size: 2rem; font-weight: bold; color: #009688; margin-top: 5px; }
        
        .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mini-card { background-color: #121314; border: 1px solid #2a2d32; padding: 12px; border-radius: 8px; text-align: center; }
        .mini-card .value { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .value.plus { color: #4caf50; }
        .value.minus { color: #cf6679; }

        .input-box {
            width: 100%; background-color: #121314; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 15px; border-radius: 8px; font-size: 1.1rem; outline: none; transition: border 0.2s;
        }
        .input-box:focus { border-color: #009688; }

        .section-title { font-size: 0.9rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        
        .money-list { display: flex; flex-direction: column; gap: 10px; }
        .money-item {
            background-color: #121314; border: 1px solid #2a2d32; padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; position: relative;
        }
        .item-details { display: flex; flex-direction: column; gap: 4px; }
        .item-category { font-size: 1.05rem; color: #e2e2e2; }
        .item-date { font-size: 0.8rem; color: #8a8
