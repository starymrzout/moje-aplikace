<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanční bilance</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d32; padding-bottom: 15px; }
        h1 { font-size: 1.4rem; font-weight: 400; color: #f0f0f0; }
        
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }

        /* Karty s bilancí */
        .balance-card { background-color: #121314; border: 1px solid #2a2d32; padding: 20px; border-radius: 8px; text-align: center; }
        .balance-value { font-size: 2rem; font-weight: bold; color: #009688; margin-top: 5px; }
        
        .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mini-card { background-color: #121314; border: 1px solid #2a2d32; padding: 12px; border-radius: 8px; text-align: center; }
        .mini-card .value { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .value.plus { color: #4caf50; }
        .value.minus { color: #cf6679; }

        .input-box {
            width: 100%; background-color: #121314; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 15px; border-radius: 8px; font-size: 1.1rem; outline: none; transition: border 0.2s;
        }
        .input-box:focus { border-color: #009688; }

        .section-title { font-size: 0.9rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        
        .money-list { display: flex; flex-direction: column; gap: 10px; }
        .money-item {
            background-color: #121314; border: 1px solid #2a2d32; padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; position: relative;
        }
        .item-details { display: flex; flex-direction: column; gap: 4px; }
        .item-category { font-size: 1.05rem; color: #e2e2e2; }
        .item-date { font-size: 0.8rem; color: #8a8d92; }
        .item-amount { font-size: 1.1rem; font-weight: bold; margin-right: 25px; }
        
        .delete-btn {
            position: absolute; right: 15px; background: transparent; border: none;
            color: #4a4d52; cursor: pointer; font-size: 0.9rem; transition: color 0.2s;
        }
        .delete-btn:hover { color: #cf6679; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Peníze a Výdaje</h1>
            <div class="sync-status" id="sync-status"></div>
        </div>

        <div class="balance-card">
            <div style="font-size: 0.9rem; color: #8a8d92; text-transform: uppercase;">Aktuální stav</div>
            <div class="balance-value" id="total-balance">0 Kč</div>
        </div>

        <div class="mini-cards">
            <div class="mini-card">
                <div style="font-size: 0.8rem; color: #8a8d92; text-transform: uppercase;">Příjmy</div>
                <div class="value plus" id="total-income">0 Kč</div>
            </div>
            <div class="mini-card">
                <div style="font-size: 0.8rem; color: #8a8d92; text-transform: uppercase;">Výdaje</div>
                <div class="value minus" id="total-expense">0 Kč</div>
            </div>
        </div>

        <input type="text" id="money-input" class="input-box" placeholder="Částka a kategorie (např. -120 Oběd)..." autofocus>

        <div class="section-title">Poslední pohyby</div>
        <div class="money-list" id="money-list"></div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let items = [];
        
        const moneyInput = document.getElementById('money-input');
        const moneyList = document.getElementById('money-list');
        const syncStatus = document.getElementById('sync-status');
        
        const totalBalance = document.getElementById('total-balance');
        const totalIncome = document.getElementById('total-income');
        const totalExpense = document.getElementById('total-expense');

        function setStatus(status) { syncStatus.className = 'sync-status ' + status; }

        window.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            setStatus('syncing');
            const local = localStorage.getItem('simplenote_money_data');
            if (local) { try { items = JSON.parse(local); render(); } catch(e) { items = []; } }
            try {
                const response = await fetch(`${CLOUD_URL}?mode=penize`);
                const cloudItems = await response.json();
                if (cloudItems && Array.isArray(cloudItems)) {
                    items = cloudItems;
                    localStorage.setItem('simplenote_money_data', JSON.stringify(items));
                    render();
                    setStatus('online');
                }
            } catch (err) { console.error(err); setStatus('error'); }
        }

        moneyInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && moneyInput.value.trim() !== '') {
                const val = moneyInput.value.trim();
                const spaceIndex = val.indexOf(' ');
                
                if (spaceIndex === -1) {
                    alert('Napiš částku a pak mezeru a kategorii! (Např: -150 Tesco)');
                    return;
                }

                const amountStr = val.substring(0, spaceIndex).replace(',', '.');
                const categoryStr = val.substring(spaceIndex + 1).trim();
                const amountNum = parseFloat(amountStr);

                if (isNaN(amountNum)) {
                    alert('První musí být číslo! (Např: -150)');
                    return;
                }

                const newItem = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleDateString('cs-CZ'),
                    amount: amountNum,
                    category: categoryStr
                };

                items.unshift(newItem); // Přidat navrh seznamu
                moneyInput.value = '';
                render();

                localStorage.setItem('simplenote_money_data', JSON.stringify(items));

                try {
                    setStatus('syncing');
                    await fetch(CLOUD_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ type: 'penize_add', item: newItem })
                    });
                    setStatus('online');
                } catch (err) { setStatus('error'); }
            }
        });

        async function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            render();
            localStorage.setItem('simplenote_money_data', JSON.stringify(items));

            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ type: 'penize_delete', id: id })
                });
                setStatus('online');
            } catch (err) { setStatus('error'); }
        }

        function render() {
            moneyList.innerHTML = '';
            if (!Array.isArray(items)) items = [];

            let jstPrijmy = 0;
            let jstVydaje = 0;

            if (items.length === 0) {
                moneyList.innerHTML = '<div style="color: #4a4d52; font-style: italic; text-align: center; font-size: 0.95rem;">Žádné pohyby...</div>';
                totalBalance.innerText = '0 Kč';
                totalIncome.innerText = '0 Kč';
                totalExpense.innerText = '0 Kč';
                return;
            }

            items.forEach(item => {
                if (!item) return;
                
                const castka = parseFloat(item.amount || 0);
                
                // Kladná čísla jsou příjem, záporná jsou výdaj
                if (castka > 0) {
                    jstPrijmy += castka;
                } else {
                    jstVydaje += Math.abs(castka);
                }

                const el = document.createElement('div');
                el.className = 'money-item';
                
                const colorClass = castka > 0 ? 'plus' : 'minus';
                const sign = castka > 0 ? '+' : '';

                el.innerHTML = `
                    <div class="item-details">
                        <div class="item-category">${item.category || 'Bez kategorie'}</div>
                        <div class="item-date">${item.date || ''}</div>
                    </div>
                    <div class="item-amount ${colorClass}">${sign}${castka.toLocaleString('cs-CZ')} Kč</div>
                    <button class="delete-btn" onclick="deleteItem('${item.id}')">✕</button>
                `;
                moneyList.appendChild(el);
            });

            const bilance = jstPrijmy - jstVydaje;

            totalBalance.innerText = bilance.toLocaleString('cs-CZ') + ' Kč';
            totalIncome.innerText = jstPrijmy.toLocaleString('cs-CZ') + ' Kč';
            totalExpense.innerText = jstVydaje.toLocaleString('cs-CZ') + ' Kč';
            
            if (bilance > 0) {
                totalBalance.style.color = '#4caf50';
            } else if (bilance < 0) {
                totalBalance.style.color = '#cf6679';
            } else {
                totalBalance.style.color = '#
