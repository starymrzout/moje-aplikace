<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peníze a Bilance</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; padding: 30px 20px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d32; padding-bottom: 15px; }
        h1 { font-size: 1.3rem; font-weight: 400; color: #f0f0f0; }
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }
        .budget-box {
            background-color: #121314; border: 1px solid #2a2d32; padding: 20px; border-radius: 12px;
            text-align: center; display: flex; flex-direction: column; gap: 5px;
        }
        .budget-title { font-size: 0.85rem; color: #8a8d92; text-transform: uppercase; font-weight: bold; }
        .budget-value { font-size: 2.2rem; font-weight: 300; color: #009688; }
        .budget-value.minus { color: #cf6679; }
        .input-amount {
            width: 100%; background-color: #121314; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 18px; border-radius: 12px; font-size: 2rem; text-align: center; outline: none;
            transition: border 0.2s; font-weight: 300;
        }
        .input-amount:focus { border-color: #009688; }
        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cat-btn {
            background-color: #2a2d32; color: #e2e2e2; border: none; padding: 18px;
            border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
            transition: all 0.1s; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .cat-btn:active { transform: scale(0.96); background-color: #3a3f45; }
        .btn-income { background-color: #1b4d3e; color: #a3e2c9; border: 1px solid #009688; grid-column: span 2; }
        .btn-income:active { background-color: #009688; color: white; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .history-item {
            background-color: #121314; border: 1px solid #2a2d32; padding: 12px 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;
        }
        .history-left { display: flex; flex-direction: column; gap: 2px; }
        .history-cat { font-weight: bold; color: #f0f0f0; }
        .history-date { font-size: 0.75rem; color: #8a8d92; }
        .history-right { display: flex; align-items: center; gap: 15px; }
        .history-amt { font-weight: bold; }
        .history-amt.expense { color: #cf6679; }
        .history-amt.income { color: #4caf50; }
        .del-btn { background: transparent; border: none; color: #4a4d52; cursor: pointer; font-size: 1rem; }
        .del-btn:hover { color: #cf6679; }
        .section-title { font-size: 0.85rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Peníze a bilance</h1>
            <div class="sync-status" id="sync-status"></div>
        </div>
        <div class="budget-box">
            <div class="budget-title">Bilance tento měsíc</div>
            <div class="budget-value" id="total-budget">0 Kč</div>
        </div>
        <input type="number" id="amount-input" class="input-amount" placeholder="0" inputmode="numeric" pattern="[0-9]*">
        <div class="categories-grid">
            <button class="cat-btn btn-income" onclick="addExpense('💰 Příjem')">💰 PŘÍJEM</button>
            <button class="cat-btn" onclick="addExpense('🍞 Jídlo a nákupy')">🍞 Jídlo a nákupy</button>
            <button class="cat-btn" onclick="addExpense('🚗 Auto')">🚗 Auto</button>
            <button class="cat-btn" onclick="addExpense('📱 Mobily')">📱 Mobily</button>
            <button class="cat-btn" onclick="addExpense('🍿 Zábava')">🍿 Zábava</button>
            <button class="cat-btn" onclick="addExpense('🏠 Domácnost')">🏠 Domácnost</button>
            <button class="cat-btn" onclick="addExpense('👶 Děti')">👶 Děti</button>
        </div>
        <div class="section-title">Poslední pohyby</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let expenses = [];
        const amountInput = document.getElementById('amount-input');
        const totalBudget = document.getElementById('total-budget');
        const historyList = document.getElementById('history-list');
        const syncStatus = document.getElementById('sync-status');

        function setStatus(status) { syncStatus.className = 'sync-status ' + status; }

        window.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            setStatus('syncing');

            // Zobraz lokální data okamžitě
            const local = localStorage.getItem('simplenote_money_data');
            if (local) { try { expenses = JSON.parse(local); render(); } catch(e) { expenses = []; } }

            try {
                const response = await fetch(`${CLOUD_URL}?mode=penize`);
                const cloudExpenses = await response.json();

                if (Array.isArray(cloudExpenses)) {
                    // Přijmi data z cloudu i když je pole prázdné
                    expenses = cloudExpenses;
                    localStorage.setItem('simplenote_money_data', JSON.stringify(expenses));
                    render();
                }
                // Zelená tečka vždy když cloud odpoví — bez ohledu na počet záznamů
                setStatus('online');

            } catch (err) {
                // Chyba sítě — data z localStorage zůstanou viditelná
                setStatus('error');
            }
        }

        async function addExpense(category) {
            const val = parseFloat(amountInput.value);
            if (isNaN(val) || val <= 0) return;

            const now = new Date();
            const newItem = {
                id: Date.now().toString(),
                date: now.toISOString(),
                amount: val,
                category: category
            };

            expenses.unshift(newItem);
            amountInput.value = '';
            render();
            localStorage.setItem('simplenote_money_data', JSON.stringify(expenses));

            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'penize_add', item: newItem })
                });
                setStatus('online');
            } catch (err) {
                setStatus('error');
            }
        }

        async function deleteExpense(id) {
            expenses = expenses.filter(e => e.id !== id);
            render();
            localStorage.setItem('simplenote_money_data', JSON.stringify(expenses));

            try {
                setStatus('syncing');
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'penize_delete', id: id })
                });
                setStatus('online');
            } catch (err) {
                setStatus('error');
            }
        }

        function render() {
            historyList.innerHTML = '';
            if (!Array.isArray(expenses)) expenses = [];

            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();

            let balance = 0;
            expenses.forEach(item => {
                if (item && item.date) {
                    // Parsuj datum ať přijde v jakémkoliv formátu
                    const d = new Date(item.date);
                    const m = d.getMonth() + 1;
                    const y = d.getFullYear();
                    if (m === currentMonth && y === currentYear) {
                        if (item.category.trim() === '💰 Příjem') {
                            balance += item.amount;
                        } else {
                            balance -= item.amount;
                        }
                    }
                }
            });

            if (balance < 0) {
                totalBudget.className = 'budget-value minus';
                totalBudget.innerText = balance.toLocaleString('cs-CZ') + ' Kč';
            } else {
                totalBudget.className = 'budget-value';
                totalBudget.innerText = '+' + balance.toLocaleString('cs-CZ') + ' Kč';
            }

            if (expenses.length === 0) {
                historyList.innerHTML = '<div style="color: #4a4d52; font-style: italic; text-align: center; font-size: 0.95rem;">Žádné záznamy...</div>';
                return;
            }

            expenses.forEach(item => {
                if (!item) return;
                const isIncome = item.category.trim() === '💰 Příjem';
                const el = document.createElement('div');
                el.className = 'history-item';
                const displayDate = new Date(item.date).toLocaleDateString('cs-CZ');
                el.innerHTML = `
                    <div class="history-left">
                        <div class="history-cat">${item.category}</div>
                        <div class="history-date">${displayDate}</div>
                    </div>
                    <div class="history-right">
                        <div class="history-amt ${isIncome ? 'income' : 'expense'}">
                            ${isIncome ? '+' : '-'}${item.amount} Kč
                        </div>
                        <button class="del-btn" onclick="deleteExpense('${item.id}')">✕</button>
                    </div>
                `;
                historyList.appendChild(el);
            });
        }
    </script>
</body>
</html>
