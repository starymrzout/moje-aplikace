<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trenažér Techniky Bus (D) 🎯</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            background-color: #121314;
            color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1c1e;
            border-left: 1px solid #2a2d32;
            border-right: 1px solid #2a2d32;
        }

        header {
            padding: 12px 16px;
            background-color: #151719;
            border-bottom: 1px solid #2a2d32;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #00bfa5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            font-size: 0.75rem;
            background: #2a2d32;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .stat-h1 { color: #cf6679; }
        .stat-h2 { color: #ffb74d; }
        .stat-h3 { color: #4caf50; }

        .mode-toggle-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background-color: #121314;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #2a2d32;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #8a8d92;
            padding: 6px 4px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-align: center;
        }
        .mode-btn.active {
            background-color: #009688;
            color: #ffffff;
        }

        .filter-toggle-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background-color: #121314;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #2a2d32;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #8a8d92;
            padding: 5px 2px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-align: center;
        }
        .filter-btn.active { background-color: #2a2d32; color: #00bfa5; }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-card {
            background-color: #151719;
            border: 1px solid #2a2d32;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8a8d92;
            font-weight: bold;
        }

        .q-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.35;
            color: #fff;
        }

        .instruction-box {
            font-size: 0.8rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        /* Režim 5 z 10 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            background-color: #212428;
            border: 1px solid #2d3138;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.88rem;
            line-height: 1.35;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: all 0.15s;
            user-select: none;
        }
        .option-item:hover { background-color: #2a2d32; border-color: #3e444d; }

        .checkbox-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid #5a6069;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: transparent;
            margin-top: 1px;
        }

        .option-item.selected {
            border-color: #00bfa5;
            background-color: #172d29;
        }
        .option-item.selected .checkbox-box {
            border-color: #00bfa5;
            background-color: #00bfa5;
            color: #121314;
        }

        .option-item.correct-hit {
            border-color: #4caf50 !important;
            background-color: #152b18 !important;
            color: #a5d6a7;
        }
        .option-item.correct-hit .checkbox-box {
            border-color: #4caf50 !important;
            background-color: #4caf50 !important;
            color: white;
        }

        .option-item.wrong-hit {
            border-color: #cf6679 !important;
            background-color: #33161c !important;
            color: #ef9a9a;
        }
        .option-item.wrong-hit .checkbox-box {
            border-color: #cf6679 !important;
            background-color: #cf6679 !important;
            color: white;
        }

        .option-item.missed {
            border-color: #ffb74d !important;
            background-color: #332712 !important;
            color: #ffe082;
            border-style: dashed;
        }
        .option-item.missed .checkbox-box {
            border-color: #ffb74d !important;
            color: #ffb74d;
        }

        /* Režim Výslech u komisaře */
        .pillar-card {
            background-color: #1a1c1e;
            border: 1px solid #2a2d32;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pillar-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #00bfa5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pillar-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pillar-opt {
            background-color: #212428;
            border: 1px solid #2d3138;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.84rem;
            cursor: pointer;
            line-height: 1.3;
            transition: all 0.15s;
        }
        .pillar-opt:hover { background-color: #2a2d32; }
        .pillar-opt.selected { border-color: #00bfa5; background-color: #172d29; color: #fff; }
        .pillar-opt.correct { border-color: #4caf50 !important; background-color: #152b18 !important; color: #a5d6a7; }
        .pillar-opt.wrong { border-color: #cf6679 !important; background-color: #33161c !important; color: #ef9a9a; }

        /* Tahák po vyhodnocení */
        .summary-box {
            background-color: #151719;
            border-radius: 8px;
            padding: 14px;
            border: 1px solid #00796b;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .summary-header {
            font-size: 0.78rem;
            font-weight: 700;
            color: #00bfa5;
            text-transform: uppercase;
        }
        .summary-row {
            font-size: 0.85rem;
            line-height: 1.35;
            color: #ddd;
            border-left: 2px solid #00796b;
            padding-left: 8px;
        }
        .summary-row strong { color: #fff; }

        .result-box {
            background-color: #151719;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #2a2d32;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
        }

        footer {
            padding: 12px 16px;
            background-color: #151719;
            border-top: 1px solid #2a2d32;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-check { background-color: #009688; color: white; }
        .btn-check:hover { background-color: #00bfa5; }

        .btn-next { background-color: #3b82f6; color: white; }
        .btn-next:hover { background-color: #2563eb; }

        .btn-prev {
            width: 70px;
            background-color: #2a2d32;
            color: #e2e2e2;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="header-title">🎯 Trenažér Techniky Bus (D)</div>
                <div class="stats-badge" id="stats-badge">
                    <span class="stat-h1" id="st-h1">H1: 45</span> | 
                    <span class="stat-h2" id="st-h2">H2: 0</span> | 
                    <span class="stat-h3" id="st-h3">H3: 0</span>
                </div>
            </div>

            <!-- Přepínač režimu učení -->
            <div class="mode-toggle-box">
                <button class="mode-btn active" id="m-pillars" onclick="setMode('pillars')">🎙️ Výslech (4 body)</button>
                <button class="mode-btn" id="m-classic" onclick="setMode('classic')">🔍 Detaily (5 z 10)</button>
            </div>

            <div class="filter-toggle-box">
                <button class="filter-btn active" id="f-all" onclick="setFilter('all')">Vše (45)</button>
                <button class="filter-btn" id="f-box1" onclick="setFilter('box1')">❌ Neumím</button>
                <button class="filter-btn" id="f-box2" onclick="setFilter('box2')">⚡ Váhám</button>
                <button class="filter-btn" id="f-box3" onclick="setFilter('box3')">✅ Umím</button>
            </div>
        </header>

        <div class="content" id="content-area">
            <div class="question-card">
                <div class="q-meta">
                    <span id="q-number">Otázka 1 ze 45</span>
                    <span id="q-status-badge">Stav: ❌ Neumím</span>
                </div>
                <div class="q-title" id="q-title">Načítání otázky...</div>
            </div>

            <div class="instruction-box" id="instruction-box">
                <span id="instruction-text">Zvol správnou odpověď pro každý ze 4 bodů:</span>
                <span id="selected-counter" style="color: #00bfa5; font-weight: bold;"></span>
            </div>

            <div id="test-body"></div>

            <div class="result-box" id="result-box" style="display: none;"></div>

            <!-- Tahák po kontrole -->
            <div class="summary-box" id="summary-box" style="display: none;">
                <div class="summary-header">🎯 Kostra pro komisaře u této otázky:</div>
                <div class="summary-row" id="sum-what"></div>
                <div class="summary-row" id="sum-check"></div>
                <div class="summary-row" id="sum-fail"></div>
                <div class="summary-row" id="sum-fix"></div>
            </div>
        </div>

        <footer>
            <button class="action-btn btn-prev" onclick="prevQuestion()">‹ Zpět</button>
            <button class="action-btn btn-check" id="main-btn" onclick="handleMainAction()">ZKONTROLOVAT</button>
        </footer>
    </div>

                    check: "Test kontrolek po zapnutí zapalování – funkční žárovky a diody v palubním štítu.",
                    fail: "ČERVENÁ = okamžité zastavení (olej, dobíjení, brzdy, dveře). ŽLUTÁ = výstraha (ABS, ASR, DPF, palivo).",
                    fix: "Při červené ihned bezpečně zastavit a vypnout motor; při žluté zvýšit opatrnost a závadu řešit při nejbližší příležitosti."
                },
                points: [ "Červené kontrolky: kritické – mazání, dobíjení, teplota motoru, parkovací brzda, závada brzd", "Oranžové / Žluté: výstražné – ABS, ASR, opotřebení brzd, žhavení, filtr pevných částic, palivo", "Zelené / Modré: informační – směrová světla, potkávací světla, dálková světla (modrá)", "U autobusů: kontrolky otevření dveří pro cestující, zastávkové brzdy a kneeling (poklek)", "Ovladače: páčky pod volantem (směrovky, stěrače, retardér), spínače dveří a osvětlení" ]
            },
            {
                id: 41,
                title: "41. Postup při připojení tažného lana a tažné tyče a možnosti jejich použití",
                core: {
                    what: "Nouzové odtažení nepojízdného vozidla (autobus se smí vléci VÝHRADNĚ BEZ CESTUJÍCÍCH!).",
                    check: "Stav závěsu, zajištění čepu pojistkou, označení tyče pruhy (tyč 1–6 m, lano 2,5–6 m s praporkem).",
                    fail: "Přetržení lana, zadření převodovky vlečením (nutno sundat kardan!), zablokování kol bez vzduchu.",
                    fix: "Při vadných brzdách POUZE TYČ; max. rychlost 60 km/h; mechanicky odbrzdit pružinové brzdové válce šrouby a demontovat kardan."
                },
                points: [ "Rychlost vlečení nejvýše 60 km/h; řidiči si předem dohodnou způsob dorozumívání", "ZVLÁŠTNÍ USTANOVENÍ: AUTOBUS SE SMÍ VLÉCI POUZE BEZ PŘEPRAVOVANÝCH OSOB!", "Tažné lano: délka 2,5–6 m + červený praporek 300×300 mm (funkční řízení i účinné brzdy)", "Tažná tyč: délka 1–6 m s červeno-bílými pruhy 75 mm (POVINNÁ při neúčinných brzdách)", "Při neúčinných brzdách nesmí hmotnost vlečeného vozu převýšit hmotnost vlečného vozu" ]
            },
            {
                id: 42,
                title: "42. Popište postup při montáži sněhových řetězů",
                core: {
                    what: "Zajištění trakce a brzdění na souvislé vrstvě sněhu a ledu montáží na hnací (zadní) nápravu.",
                    check: "Ověřit velikost řetězů k rozměru pneu před zimou, stav napínacích pák a neporušenost článků.",
                    fail: "Uvolnění řetězu (rozbití brzdových hadic a podběhu), prasknutí řetězu na holém asfaltu (max. 50 km/h!).",
                    fix: "Rozložit, najet, spojit vnitřní háček, napnout vnější pákou a zajistit; PO 50–100 METRECH ZASTAVIT A ZNOVU DOPNOUT."
                },
                points: [ "Montáž: nejméně na kola poháněné nápravy (u autobusu kola zadní nápravy)", "Přípustnost: pouze na vozovkách pokrytých souvislou vrstvou sněhu nebo ledu", "Rychlost: s namontovanými řetězy je dovoleno jet rychlostí maximálně 50 km/h", "Postup: položit před kolo, najet na ně, spojit vnitřní háček, napnout vnější pákou a zajistit", "Kontrola: po krátkém popojetí (50–100 m) zkontrolovat napnutí řetězů a zajistit páky" ]
            },
            {
                id: 43,
                title: "43. Základní funkce tachografu a v čem spočívá jeho obsluha",
                core: {
                    what: "Státní kontrolní zařízení zaznamenávající rychlost, vzdálenost a režimy práce řidiče (Nařízení ES 561/2006).",
                    check: "Platnost kalibrace tachografu (štítek), zásoba papíru v tiskárně, vložení karty řidiče do slotu 1.",
                    fail: "Jízda bez karty (hrubý přestupek), špatně zadaná výchozí země, vyčerpaný papír v tiskárně při kontrole policií.",
                    fix: "Zasouvat kartu čipem nahoru před směnou, potvrdit odpočinek, zadat symbol země (CZ), při kontrole vytisknout denní výtisk."
                },
                points: [ "Tachograf ukazuje a zaznamenává: ujetou vzdálenost, rychlost jízdy a časové režimy činnosti", "Režimy činnosti: doba řízení (volant), jiná práce (kladívka), pohotovost (čtverec), odpočinek (postýlka)", "Digitální tachograf: obsluha čipovou kartou řidiče zasunutou do slotu 1 (čipem nahoru)", "Začátek a konec směny: zadání symbolu výchozí země (CZ) a cílové země (CZ)", "Povinnost výtisku denních činností z tiskárny na vyžádání kontrolního orgánu" ]
            },
            {
                id: 44,
                title: "44. Postup při připojování a odpojování přívěsu",
                core: {
                    what: "Bezpečné spojení soupravy vozidla a vleku (např. cyklovlek nebo zavazadlový přívěs za autobusem).",
                    check: "Pojistný kolík závěsu zacvaknutý, vůle do 5 mm, čistota těsnění brzdových hlavic.",
                    fail: "Smrtelný úraz při ručním navádění odbrzděného vleku; rozpojení soupravy za jízdy; únik vzduchu z brzd.",
                    fix: "VŽDY najíždět busem k zabržděnému vleku! Hadice: NEJPRVE ŽLUTÁ (ovládací), PAK ČERVENÁ (plnicí). Odpojování OBRÁCENĚ."
                },
                points: [ "VŽDY najíždíme tažným vozidlem na zajištěný přívěs (ZÁKAZ navádět odbrzděný přívěs ručně!)", "Nacouvat na cca 20 cm od oje, seřídit výšku oje na hubici závěsu, otevřít čep závěsu", "Opatrně nacouvat až do automatického zacvaknutí, zkontrolovat zasunutí pojistného kolíku závěsu", "Propojení: brzdové hadice (NEJPRVE ŽLUTÁ OVLÁDACÍ, PAK ČERVENÁ PLNICÍ), elektrika, ABS kabel", "Odstranit klíny, odbrzdit vlek; Při odpojování OBRÁCENÝ postup (nejdříve zabrzdit vlek a založit klíny)" ]
            },
            {
                id: 45,
                title: "45. Vyjmenujte povinné vybavení vozidla (se zaměřením na autobus)",
                core: {
                    what: "Zákonem stanovená nouzová a bezpečnostní výbava pro záchranu cestujících a řešení nehod (kategorie M2, M3).",
                    check: "Platná roční revize hasicích přístrojů (min. 6 kg náplně), autolékárnička velikosti II/III, přítomnost únikových kladívek.",
                    fail: "Prošlá revize hasičáku, chybějící kladívka u nouzových oken, absence zakládacích klínů (pokuta a zákaz jízdy).",
                    fix: "Před výjezdem zkontrolovat: hasicí přístroje 6 kg s plombou, lékárničku, vestu, trojúhelník, min. 2 klíny, žárovky a pojistky."
                },
                points: [ "Hasicí přístroje: u autobusu hasicí přístroj s celkovou náplní min. 6 kg (platná roční revize!)", "Autolékárnička pro hromadnou přepravu: velikost II (do 80 osob) nebo velikost III (nad 80 osob)", "Kladívka pro nouzový únik: umístěná v dosahu označených nouzových oken", "Výstražný trojúhelník, reflexní vesta pro řidiče, min. 2 zakládací klíny", "Náhradní žárovky a pojistky po 1 ks od druhu, příruční zvedák a klíč na kola (pokud není asistence)" ]
            }
        ];

        const STORAGE_KEY = 'bus_technika_quiz_progress';

        let questions = [];
        let currentFilter = 'all';
        let currentMode = 'pillars'; // 'pillars' | 'classic'
        let currentQIndex = 0;
        let isEvaluated = false;

        // Stav pro klasický režim (5 z 10)
        let classicOptions = [];
        let selectedClassic = new Set();

        // Stav pro režim výslechu (4 pilíře)
        let pillarState = {
            what: { options: [], selected: null, correctIdx: -1 },
            check: { options: [], selected: null, correctIdx: -1 },
            fail: { options: [], selected: null, correctIdx: -1 },
            fix: { options: [], selected: null, correctIdx: -1 }
        };

        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            const progress = saved ? JSON.parse(saved) : {};

            questions = questionsData.map(q => ({
                ...q,
                box: progress[q.id] || 1
            }));

            updateStats();
            loadQuestion();
        }

        function saveProgress() {
            const progress = {};
            questions.forEach(q => { progress[q.id] = q.box; });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            updateStats();
        }

        function updateStats() {
            const h1 = questions.filter(q => q.box === 1).length;
            const h2 = questions.filter(q => q.box === 2).length;
            const h3 = questions.filter(q => q.box === 3).length;

            document.getElementById('st-h1').innerText = `H1: ${h1}`;
            document.getElementById('st-h2').innerText = `H2: ${h2}`;
            document.getElementById('st-h3').innerText = `H3: ${h3}`;

            document.getElementById('f-all').innerText = `Vše (${questions.length})`;
            document.getElementById('f-box1').innerText = `❌ Neumím (${h1})`;
            document.getElementById('f-box2').innerText = `⚡ Váhám (${h2})`;
            document.getElementById('f-box3').innerText = `✅ Umím (${h3})`;
        }

        function getFilteredQuestions() {
            if (currentFilter === 'box1') return questions.filter(q => q.box === 1);
            if (currentFilter === 'box2') return questions.filter(q => q.box === 2);
            if (currentFilter === 'box3') return questions.filter(q => q.box === 3);
            return questions;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode === 'pillars' ? 'm-pillars' : 'm-classic').classList.add('active');
            loadQuestion();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`f-${filter}`).classList.add('active');
            currentQIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const activeList = getFilteredQuestions();
            if (activeList.length === 0) {
                document.getElementById('q-title').innerText = "V této kategorii nemáte žádné otázky!";
                document.getElementById('test-body').innerHTML = "";
                document.getElementById('result-box').style.display = 'none';
                document.getElementById('summary-box').style.display = 'none';
                document.getElementById('main-btn').style.display = 'none';
                return;
            }

            document.getElementById('main-btn').style.display = 'block';

            if (currentQIndex >= activeList.length) currentQIndex = 0;
            const q = activeList[currentQIndex];

            document.getElementById('q-number').innerText = `Otázka ${q.id} ze 45 (filtr: ${currentQIndex + 1}/${activeList.length})`;
            document.getElementById('q-title').innerText = q.title;

            const badge = document.getElementById('q-status-badge');
            if (q.box === 1) {
                badge.innerText = 'Stav: ❌ Neumím';
                badge.style.color = '#cf6679';
            } else if (q.box === 2) {
                badge.innerText = 'Stav: ⚡ Váhám';
                badge.style.color = '#ffb74d';
            } else {
                badge.innerText = 'Stav: ✅ Umím perfektně';
                badge.style.color = '#4caf50';
            }

            isEvaluated = false;
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('summary-box').style.display = 'none';
            document.getElementById('main-btn').innerText = "ZKONTROLOVAT";
            document.getElementById('main-btn').className = "action-btn btn-check";

            // Příprava taháku pro vyhodnocení
            document.getElementById('sum-what').innerHTML = `<strong>1. K čemu to je:</strong> ${q.core.what}`;
            document.getElementById('sum-check').innerHTML = `<strong>2. Kontrola:</strong> ${q.core.check}`;
            document.getElementById('sum-fail').innerHTML = `<strong>3. Závady:</strong> ${q.core.fail}`;
            document.getElementById('sum-fix').innerHTML = `<strong>4. Řešení řidiče:</strong> ${q.core.fix}`;

            if (currentMode === 'pillars') {
                setupPillarsMode(q);
            } else {
                setupClassicMode(q);
            }
        }

        // --- REŽIM 1: VÝSLECH (4 PILÍŘE) ---
        function setupPillarsMode(q) {
            document.getElementById('instruction-text').innerText = "Vyber správnou odpověď pro každý ze 4 bodů:";
            document.getElementById('selected-counter').innerText = "";

            const pillars = ['what', 'check', 'fail', 'fix'];
            pillarState = {};

            pillars.forEach(key => {
                const correctText = q.core[key];
                const otherTexts = questionsData
                    .filter(item => item.id !== q.id)
                    .map(item => item.core[key])
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 2);

                const opts = [correctText, ...otherTexts].sort(() => Math.random() - 0.5);
                pillarState[key] = {
                    options: opts,
                    selected: null,
                    correctIdx: opts.indexOf(correctText)
                };
            });

            renderPillars();
        }

        function renderPillars() {
            const container = document.getElementById('test-body');
            container.innerHTML = '';

            const titles = {
                what: "1. K čemu to slouží / Co to dělá:",
                check: "2. Jak to zkontroluji před jízdou:",
                fail: "3. Co se může posrat / Jak to poznám:",
                fix: "4. Co s tím udělám (Řešení řidiče):"
            };

            ['what', 'check', 'fail', 'fix'].forEach(key => {
                const p = pillarState[key];
                const card = document.createElement('div');
                card.className = 'pillar-card';

                const lbl = document.createElement('div');
                lbl.className = 'pillar-label';
                lbl.innerText = titles[key];
                card.appendChild(lbl);

                const optsBox = document.createElement('div');
                optsBox.className = 'pillar-options';

                p.options.forEach((optText, idx) => {
                    const btn = document.createElement('div');
                    btn.className = `pillar-opt ${p.selected === idx ? 'selected' : ''}`;
                    
                    if (isEvaluated) {
                        if (idx === p.correctIdx) {
                            btn.classList.add('correct');
                        } else if (p.selected === idx && idx !== p.correctIdx) {
                            btn.classList.add('wrong');
                        }
                    }

                    btn.innerText = optText;
                    btn.onclick = () => {
                        if (isEvaluated) return;
                        p.selected = idx;
                        renderPillars();
                    };
                    optsBox.appendChild(btn);
                });

                card.appendChild(optsBox);
                container.appendChild(card);
            });
        }

        // --- REŽIM 2: DETAILY (5 Z 10) ---
        function setupClassicMode(q) {
            document.getElementById('instruction-text').innerText = "Označ 5 správných bodů (záchytných detailů):";
            document.getElementById('selected-counter').innerText = "0 / 5 vybráno";

            const correct = q.points.map(text => ({ text, isCorrect: true }));
            
            const otherPoints = [];
            questionsData.forEach(item => {
                if (item.id !== q.id) otherPoints.push(...item.points);
            });
            otherPoints.sort(() => Math.random() - 0.5);
            const distractors = otherPoints.slice(0, 5).map(text => ({ text, isCorrect: false }));

            classicOptions = [...correct, ...distractors].sort(() => Math.random() - 0.5);
            selectedClassic.clear();

            renderClassic();
        }

        function renderClassic() {
            const container = document.getElementById('test-body');
            container.innerHTML = '';

            const list = document.createElement('div');
            list.className = 'options-list';

            classicOptions.forEach((opt, idx) => {
                const item = document.createElement('div');
                item.className = `option-item ${selectedClassic.has(idx) ? 'selected' : ''}`;

                if (isEvaluated) {
                    const isSel = selectedClassic.has(idx);
                    if (isSel && opt.isCorrect) item.classList.add('correct-hit');
                    else if (isSel && !opt.isCorrect) item.classList.add('wrong-hit');
                    else if (!isSel && opt.isCorrect) item.classList.add('missed');
                }

                item.onclick = () => {
                    if (isEvaluated) return;
                    if (selectedClassic.has(idx)) {
                        selectedClassic.delete(idx);
                    } else if (selectedClassic.size < 5) {
                        selectedClassic.add(idx);
                    }
                    renderClassic();
                    document.getElementById('selected-counter').innerText = `${selectedClassic.size} / 5 vybráno`;
                };

                const chk = document.createElement('div');
                chk.className = 'checkbox-box';
                chk.innerText = selectedClassic.has(idx) ? '✓' : '';

                const txt = document.createElement('span');
                txt.innerText = opt.text;

                item.appendChild(chk);
                item.appendChild(txt);
                list.appendChild(item);
            });

            container.appendChild(list);
        }

        function handleMainAction() {
            if (!isEvaluated) {
                checkAnswers();
            } else {
                nextQuestion();
            }
        }

        function checkAnswers() {
            const activeList = getFilteredQuestions();
            const currentQ = activeList[currentQIndex];

            let score = 0;
            let total = 0;

            if (currentMode === 'pillars') {
                const keys = ['what', 'check', 'fail', 'fix'];
                const unanswered = keys.some(k => pillarState[k].selected === null);
                if (unanswered) {
                    alert("Zvol odpověď u všech 4 bodů!");
                    return;
                }
                total = 4;
                keys.forEach(k => {
                    if (pillarState[k].selected === pillarState[k].correctIdx) score++;
                });
            } else {
                if (selectedClassic.size === 0) {
                    alert("Označ alespoň nějaké body!");
                    return;
                }
                total = 5;
                selectedClassic.forEach(idx => {
                    if (classicOptions[idx].isCorrect) score++;
                    else score--; // penalizace za chyták
                });
                if (score < 0) score = 0;
            }

            isEvaluated = true;

            // Zatřídění do hromádek
            let newBox = 1;
            let resultMessage = "";

            if (score === total) {
                newBox = 3;
                resultMessage = `🏆 PERFEKTNÍ (${score}/${total})! Přesunuto do: UMÍM`;
            } else if (score >= Math.ceil(total * 0.6)) {
                newBox = 2;
                resultMessage = `⚡ DOBRÝ ZÁKLAD (${score}/${total}). Přesunuto do: VÁHÁM`;
            } else {
                newBox = 1;
                resultMessage = `❌ CHYBY (${score}/${total}). Přesunuto do: NEUMÍM`;
            }

            currentQ.box = newBox;
            saveProgress();

            const resBox = document.getElementById('result-box');
            resBox.style.display = 'block';
            resBox.innerText = resultMessage;
            resBox.style.color = newBox === 3 ? '#4caf50' : (newBox === 2 ? '#ffb74d' : '#cf6679');

            // Zobrazit tahák pro rychlé zopakování
            document.getElementById('summary-box').style.display = 'flex';

            if (currentMode === 'pillars') renderPillars();
            else renderClassic();

            const btn = document.getElementById('main-btn');
            btn.innerText = "DALŠÍ OTÁZKA ➔";
            btn.className = "action-btn btn-next";
        }

        function nextQuestion() {
            const activeList = getFilteredQuestions();
            if (activeList.length > 0) {
                currentQIndex = (currentQIndex + 1) % activeList.length;
            }
            loadQuestion();
        }

        function prevQuestion() {
            const activeList = getFilteredQuestions();
            if (activeList.length > 0) {
                currentQIndex = (currentQIndex - 1 + activeList.length) % activeList.length;
            }
            loadQuestion();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
