<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Úkoly a Rychlé nápady</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✔️</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c1e; color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d32; padding-bottom: 15px; }
        h1 { font-size: 1.4rem; font-weight: 400; color: #f0f0f0; }
        
        .sync-status { width: 10px; height: 10px; border-radius: 50%; background-color: #8a8d92; }
        .sync-status.syncing { background-color: #ffb74d; }
        .sync-status.online { background-color: #4caf50; }
        .sync-status.error { background-color: #cf6679; }

        .input-box {
            width: 100%; background-color: #121314; border: 1px solid #2a2d32; color: #f0f0f0;
            padding: 15px; border-radius: 8px; font-size: 1.1rem; outline: none; transition: border 0.2s;
        }
        .input-box:focus { border-color: #009688; }

        .section-title { font-size: 0.9rem; color: #8a8d92; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        
        .todo-list { display: flex; flex-direction: column; gap: 10px; }
        .todo-item {
            background-color: #121314; border: 1px solid #2a2d32; padding: 15px; border-radius: 8px;
            display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: background 0.2s;
        }
        .todo-item:active { background-color: #1c1e20; }
        
        .checkbox {
            width: 20px; height: 20px; border: 2px solid #009688; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
        }
        .todo-text { font-size: 1.1rem; line-height: 1.4; color: #e2e2e2; }

        .todo-item.done { border-color: #2a2d32; opacity: 0.5; }
        .todo-item.done .checkbox { border-color: #4a4d52; background-color: #2a2d32; }
        .todo-item.done .checkbox::after { content: "✓"; color: #8a8d92; font-size: 0.9rem; font-weight: bold; }
        .todo-item.done .todo-text { text-decoration: line-through; color: #8a8d92; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Úkoly a Rychlé nápady</h1>
            <div class="sync-status" id="sync-status"></div>
        </div>

        <input type="text" id="todo-input" class="input-box" placeholder="Co je třeba udělat? Napiš a stiskni Enter..." autofocus>

        <div class="section-title">Všechny poznámky</div>
        <div class="todo-list" id="todo-list"></div>
    </div>

    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxw7BhZnRdPXYT-XxUmWvbq-Lagy_fhKODrcGfu0Iz3rQR1-7EaQVemUZetnr4pU02O0g/exec";
        let todos = [];
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const syncStatus = document.getElementById('sync-status');

        function setStatus(status) { syncStatus.className = 'sync-status ' + status; }

        window.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            setStatus('syncing');
            const local = localStorage.getItem('simplenote_todo_data');
            if (local) { try { todos = JSON.parse(local); render(); } catch(e) {} }
            try {
                // OPRAVENO: Správný parametr mode=todo, který vyžaduje tvůj doGet
                const response = await fetch(`${CLOUD_URL}?mode=todo`);
                const cloudTodos = await response.json();
                if (cloudTodos && Array.isArray(cloudTodos)) {
                    todos = cloudTodos;
                    localStorage.setItem('simplenote_todo_data', JSON.stringify(todos));
                    render();
                    setStatus('online');
                }
            } catch (err) { console.error(err); setStatus('error'); }
        }

        todoInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && todoInput.value.trim() !== '') {
                const newItem = {
                    id: Date.now().toString(),
                    text: todoInput.value.trim(),
                    done: false
                };
                
                todos.push(newItem);
                todoInput.value = '';
                render();
                
                localStorage.setItem('simplenote_todo_data', JSON.stringify(todos));
                try {
                    setStatus('syncing');
                    // OPRAVENO: Posíláme typ 'todo' a balík 'items' přesně pro tvůj doPost
                    await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'todo', items: todos }) });
                    setStatus('online');
                } catch (err) { setStatus('error'); }
            }
        });

        async function toggleTodo(id) {
            // Změna stavu proběhne okamžitě na displeji
            todos = todos.map(t => {
                if (t.id === id) {
                    let txt = t.text || '';
                    if (txt.includes('#hotovo')) {
                        txt = txt.replace('#hotovo', '').trim();
                    } else {
                        txt = txt + ' #hotovo';
                    }
                    return { ...t, text: txt };
                }
                return t;
            });
            
            localStorage.setItem('simplenote_todo_data', JSON.stringify(todos));
            render();
            
            try {
                setStatus('syncing');
                // OPRAVENO: Uložíme aktualizovaný balík do buňky A2
                await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'todo', items: todos }) });
                setStatus('online');
            } catch (err) { setStatus('error'); }
        }

        function render() {
            todoList.innerHTML = '';
            if (!Array.isArray(todos)) todos = [];
            
            if (todos.length === 0) {
                todoList.innerHTML = '<div style="color: #4a4d52; font-style: italic; text-align: center; font-size: 0.95rem;">Žádné záznamy...</div>';
                return;
            }
            
            todos.forEach(item => {
                if (!item) return;
                const isDone = item.text && item.text.includes('#hotovo');
                const cleanText = item.text ? item.text.replace('#hotovo', '').trim() : '';
                
                const el = document.createElement('div');
                el.className = 'todo-item' + (isDone ? ' done' : '');
                el.onclick = () => toggleTodo(item.id);
                el.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="todo-text">${cleanText}</div>
                `;
                todoList.appendChild(el);
            });
        }
    </script>
</body>
</html>
